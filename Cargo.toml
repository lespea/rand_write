[package]
name = "rand_wipe"
version = "0.1.0"
authors = ["Adam Lesperance <lespea@gmail.com>"]
edition = "2024"

[dependencies]
anyhow = "1"
humantime = "2.0"
indicatif = "0.18"
rand = "0.10"
chacha20 = { version = "0.10", default-features = false, features = ["rng"] }
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[profile.release]
codegen-units = 1
lto = true
debug = false
strip = true
